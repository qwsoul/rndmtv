<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNDM TV — Главный плеер</title>
    
    <style>
        body {
            background-color: #0b0b0b !important;
            color: #ffffff;
            font-family: 'Futura', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 800px; width: 100%; text-align: center; margin-top: 20px; }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.35);
            margin-bottom: 20px;
            background-color: #000000;
        }
        .video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 12px; background: #000; }
        .status-bar {
            background-color: #141414;
            border: 2px solid #ff6600;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .status-online { color: #ff6600; text-transform: uppercase; letter-spacing: 1px; margin-right: 5px; }
        .schedule {
            background-color: #111111;
            border-radius: 12px;
            padding: 25px;
            text-align: left;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            border: 1px solid #1f1f1f;
        }
        .schedule h2 {
            margin-top: 0; color: #ff6600; font-size: 1.5em;
            border-bottom: 2px solid #ff6600; padding-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .schedule-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1c1c1c; font-size: 1.05em; }
        .schedule-item:last-child { border-bottom: none; }
        .time { color: #ff6600; font-weight: bold; min-width: 120px; }
        .title { color: #ffffff; flex-grow: 1; }
    </style>
</head>
<body>

<div class="container">

    <!-- Стандартный плеер, настроенный под универсальный тип видеофайлов -->
    <div class="video-wrapper">
        <video 
            id="rndm-player" 
            controls 
            preload="auto" 
            playsinline 
            webkit-playsinline>
            <source src="" type="video/mp4" />
            Бро, обнови браузер!
        </video>
    </div>

    <div class="status-bar">
        <span class="status-online">● СЕЙЧАС В ЭФИРЕ:</span> <span id="current-show">Загрузка эфира...</span>
    </div>

    <div class="schedule">
        <h2 id="schedule-title">Расписание RNDM TV</h2>
        <div id="schedule-list"></div>
    </div>

</div>

<script>
    // =================================================================
    // 🎛️ ЕДИНЫЙ ПЛЕЙЛИСТ КАНАЛА (ТВОЯ ОБЩАЯ БАЗА СКЛЕЕК)
    // Вот сюда встал твой первый реальный мульт с Гугл Диска!
    // =================================================================
    const PLAYLIST = [
        {
            url: "https://google.com",
            len: 286, // Твои 4 минуты 46 секунд
            name: "«Мульт-Тайм» (Барбоскины: Первая тестовая серия!) 🧸⚡"
        }
    ];

    function updateTV() {
        const CURRENT_MODE = "мультики"; 

        // СИНХРОНИЗАЦИЯ ПО МОСКВЕ (МСК / UTC+3) [ср. 2026]
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const adminTime = new Date(utc + (3600000 * 3)); 
        
        const hours = adminTime.getHours();
        const minutes = adminTime.getMinutes();
        const seconds = adminTime.getSeconds();
        
        const totalSecondsToday = (hours * 3600) + (minutes * 60) + seconds;

        const scheduleTitle = document.getElementById('schedule-title');
        const scheduleList = document.getElementById('schedule-list');
        const statusBar = document.getElementById('current-show');
        const videoElement = document.getElementById('rndm-player');

        let videoUrl = "";
        let startFromSecond = 0;
        let showTitle = "";

        let totalPlaylistSeconds = 0;
        for (let i = 0; i < PLAYLIST.length; i++) {
            totalPlaylistSeconds += PLAYLIST[i].len;
        }

        let currentCycleSecond = totalSecondsToday % totalPlaylistSeconds;
        let accumulatedSeconds = 0;
        let currentMedia = PLAYLIST;

        for (let i = 0; i < PLAYLIST.length; i++) {
            accumulatedSeconds += PLAYLIST[i].len;
            if (currentCycleSecond < accumulatedSeconds) {
                currentMedia = PLAYLIST[i];
                startFromSecond = currentCycleSecond - (accumulatedSeconds - PLAYLIST[i].len);
                break;
            }
        }

        videoUrl = currentMedia.url;
        showTitle = currentMedia.name;

        if (CURRENT_MODE === "фильмы") {
            scheduleTitle.innerHTML = "Расписание RNDM TV (День Фильмов) 🍿";
            scheduleList.innerHTML = `<div class="schedule-item"><span class="time">КРУГЛОСУТОЧНО</span><span class="title">🔥 ПРАЗДНИЧНЫЙ КИНОМАРАФОН: Лучшие фильмы и сериалы нон-стоп!</span></div>`;
            statusBar.innerHTML = "Большой Киномарафон на RNDM TV! 🎬🍿";
        } else {
            scheduleTitle.innerHTML = "Расписание RNDM TV (Обычный день) 📺";
            scheduleList.innerHTML = `
                <div class="schedule-item"><span class="time">09:00 - 10:30</span><span class="title">«Просыпайся-ка» (Утренний бодряк)</span></div>
                <div class="schedule-item"><span class="time">10:30 - 18:00</span><span class="title">«Мульт-тайм» (Целый день любимых мультиков)</span></div>
                <div class="schedule-item"><span class="time">18:00 - 20:00</span><span class="title">«Музыкальная вечеринка» (Анимации и треки)</span></div>
                <div class="schedule-item"><span class="time">20:00 - 09:00</span><span class="title">Ночной эфир (Уютные мультики перед сном)</span></div>
            `;
            statusBar.innerHTML = showTitle;
        }

        if (videoElement.src !== videoUrl) {
            videoElement.src = videoUrl;
            videoElement.load();
            
            videoElement.onloadedmetadata = function() {
                if (startFromSecond < videoElement.duration) {
                    videoElement.currentTime = startFromSecond;
                } else {
                    videoElement.currentTime = 0;
                }
            };
        }
    }

    updateTV();
    setInterval(updateTV, 5000);
</script>

</body>
</html>
