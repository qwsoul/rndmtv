<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNDM TV — Главный плеер</title>
    
    <style>
        /* Общие стили для вайба RNDM TV */
        body {
            background-color: #0b0b0b !important; /* Глубокий черный цвет */
            color: #ffffff;
            font-family: 'Futura', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            margin-top: 20px;
        }

        /* Профессиональный адаптивный плеер */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Пропорции экрана 16:9 */
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.35); /* Фирменное оранжевое свечение */
            margin-bottom: 20px;
            background-color: #000000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        /* Информационная плашка "Сейчас в эфире" */
        .status-bar {
            background-color: #141414;
            border: 2px solid #ff6600; /* Твой сочный оранжевый цвет */
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .status-online {
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 5px;
        }

        /* Блок расписания передач */
        .schedule {
            background-color: #111111;
            border-radius: 12px;
            padding: 25px;
            text-align: left;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            border: 1px solid #1f1f1f;
        }

        .schedule h2 {
            margin-top: 0;
            color: #ff6600;
            font-size: 1.5em;
            border-bottom: 2px solid #ff6600;
            padding-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .schedule-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1c1c1c;
            font-size: 1.05em;
        }

        .schedule-item:last-child {
            border-bottom: none;
        }

        .time {
            color: #ff6600;
            font-weight: bold;
            min-width: 120px;
        }

        .title {
            color: #ffffff;
            flex-grow: 1;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Твой вечный защищенный плеер из закрытой группы ВК -->
    <div class="video-wrapper">
        <iframe 
            src="https://vkvideo.ru/video_ext.php?oid=-228287672&id=456239018&hash=c3fb7fb170af3108&hd=3" 
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;" 
            allowfullscreen="true" 
            scrolling="no">
        </iframe>
    </div>

    <!-- Инфо-бар (Обновляется автоматически кодом по МСК) -->
    <div class="status-bar">
        <span class="status-online">● СЕЙЧАС В ЭФИРЕ:</span> <span id="current-show">Загрузка эфира...</span>
    </div>

    <!-- Твое правильное расписание -->
    <div class="schedule">
        <h2 id="schedule-title">Расписание RNDM TV</h2>
        <div id="schedule-list">
            <!-- Сюда JavaScript сам вставит нужные строки в зависимости от режима -->
        </div>
    </div>

</div>

<script>
    function updateTV() {
        const CURRENT_MODE = "мультики"; 

        // СИНХРОНИЗАЦИЯ ПО МОСКВЕ (МСК / UTC+3)
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const adminTime = new Date(utc + (3600000 * 3)); 
        
        const hours = adminTime.getHours();
        const minutes = adminTime.getMinutes();
        const timeInMinutes = hours * 60 + minutes;

        const scheduleTitle = document.getElementById('schedule-title');
        const scheduleList = document.getElementById('schedule-list');
        const statusBar = document.getElementById('current-show');

        if (CURRENT_MODE === "фильмы") {
            scheduleTitle.innerHTML = "Расписание RNDM TV (День Фильмов) 🍿";
            scheduleList.innerHTML = `
                <div class="schedule-item"><span class="time">09:00 - 10:30</span><span class="title">«Просыпайся-ка» (Утренний бодряк)</span></div>
                <div class="schedule-item"><span class="time">10:30 - 12:30</span><span class="title">«Мульт-тайм» (Топовые мультики)</span></div>
                <div class="schedule-item"><span class="time">12:30 - 00:00</span><span class="title">Большой Киномарафон (Фильмы и Сериалы нон-стоп)</span></div>
            `;

            if (timeInMinutes >= 540 && timeInMinutes < 630) {
                statusBar.innerHTML = "«Просыпайся-ка» ☀️";
            } else if (timeInMinutes >= 630 && timeInMinutes < 750) {
                statusBar.innerHTML = "«Мульт-тайм» ⚡";
            } else {
                statusBar.innerHTML = "Большой Киномарафон (Фильмы и Сериалы) 🎬🔥";
            }

        } else if (CURRENT_MODE === "шоу") {
            scheduleTitle.innerHTML = "Расписание RNDM TV (СПЕЦ-ВЫПУСК) 🚀";
            scheduleList.innerHTML = `
                <div class="schedule-item"><span class="time">09:00 - 10:30</span><span class="title">«Просыпайся-ка» (Утренний бодряк)</span></div>
                <div class="schedule-item"><span class="time">12:00 - 15:00</span><span class="title">«Мульт-тайм» (Дневной блок)</span></div>
                <div class="schedule-item"><span class="time">17:00 - 20:00</span><span class="title">🔥 НАШИ ПЕРЕДАЧИ (Эксклюзивные шоу от админов!)</span></div>
                <div class="schedule-item"><span class="time">20:00 - 23:00</span><span class="title">Вечернее кино кино кино</span></div>
            `;

            if (timeInMinutes >= 540 && timeInMinutes < 630) {
                statusBar.innerHTML = "«Просыпайся-ка» ☀️";
            } else if (timeInMinutes >= 720 && timeInMinutes < 900) {
                statusBar.innerHTML = "«Мульт-тайм» 🧸";
            } else if (timeInMinutes >= 1020 && timeInMinutes < 1200) {
                statusBar.innerHTML = "🔥 ЭФИР АДМИНОВ: Наши Спец-Передачи! 🔥";
            } else {
                statusBar.innerHTML = "Вечерний чилл 🌙";
            }

        } else {
            scheduleTitle.innerHTML = "Расписание RNDM TV (Обычный день) 📺";
            scheduleList.innerHTML = `
                <div class="schedule-item"><span class="time">09:00 - 10:30</span><span class="title">«Просыпайся-ка» (Утренний бодряк)</span></div>
                <div class="schedule-item"><span class="time">10:30 - 18:00</span><span class="title">«Мульт-тайм» (Целый день любимых мультиков)</span></div>
                <div class="schedule-item"><span class="time">18:00 - 20:00</span><span class="title">«Музыкальная вечеринка» (Анимации и треки)</span></div>
                <div class="schedule-item"><span class="time">20:00 - 09:00</span><span class="title">Ночной эфир (Уютные мультики перед сном)</span></div>
            `;

            if (timeInMinutes >= 540 && timeInMinutes < 630) {
                statusBar.innerHTML = "«Просыпайся-ка» ☀️";
            } else if (timeInMinutes >= 630 && timeInMinutes < 1080) {
                statusBar.innerHTML = "«Мульт-тайм» (Марафон мультсериалов) 🧸";
            } else if (timeInMinutes >= 1080 && timeInMinutes < 1200) {
                statusBar.innerHTML = "«Музыкальная вечеринка» 🎵🕺";
            } else {
                statusBar.innerHTML = "Ночной эфир (Уютные мультики) 🌙💤";
            }
        }
    }

    updateTV();
    setInterval(updateTV, 60000);
</script>

</body>
</html>
