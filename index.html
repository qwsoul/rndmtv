<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNDM TV — Главный плеер</title>
    
    <!-- Подключаем стильный плеер Video.js -->
    <link href="https://zencdn.net" rel="stylesheet" />
    
    <style>
        /* Общие стили для вайба RNDM TV */
        body {
            background-color: #0b0b0b !important;
            color: #ffffff;
            font-family: 'Futura', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            margin-top: 20px;
        }

        /* Стиль плеера */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.35);
            margin-bottom: 20px;
            background-color: #000000;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Информационная плашка */
        .status-bar {
            background-color: #141414;
            border: 2px solid #ff6600;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .status-online {
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 5px;
        }

        /* Блок расписания */
        .schedule {
            background-color: #111111;
            border-radius: 12px;
            padding: 25px;
            text-align: left;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            border: 1px solid #1f1f1f;
        }

        .schedule h2 {
            margin-top: 0;
            color: #ff6600;
            font-size: 1.5em;
            border-bottom: 2px solid #ff6600;
            padding-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .schedule-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1c1c1c;
            font-size: 1.05em;
        }

        .schedule-item:last-child {
            border-bottom: none;
        }

        .time {
            color: #ff6600;
            font-weight: bold;
            min-width: 120px;
        }

        .title {
            color: #ffffff;
            flex-grow: 1;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Главный экран трансляции -->
    <div class="video-wrapper">
        <video id="rndm-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" data-setup='{}'>
            <source src="https://zencdn.net" type="video/mp4" />
        </video>
    </div>

    <!-- Инфо-бар -->
    <div class="status-bar">
        <span class="status-online">● СЕЙЧАС В ЭФИРЕ:</span> <span id="current-show">Загрузка эфира...</span>
    </div>

    <!-- Расписание -->
    <div class="schedule">
        <h2 id="schedule-title">Расписание RNDM TV</h2>
        <div id="schedule-list">
            <!-- Сюда всё вставится автоматически -->
        </div>
    </div>

</div>

<!-- Скрипты плеера -->
<script src="https://zencdn.net"></script>

<script>
    function updateTV() {
        // ==========================================
        // 🎛️ ПУЛЬТ УПРАВЛЕНИЯ КАНАЛОМ:
        // Пиши "мультики" для обычного дня.
        // Пиши "фильмы" для Дня Фильмов.
        // Пиши "шоу" для спец-выпусков ваших передач.
        // ==========================================
        const CURRENT_MODE = "мультики"; 

        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const timeInMinutes = hours * 60 + minutes;

        const scheduleTitle = document.getElementById('schedule-title');
        const scheduleList = document.getElementById('schedule-list');
        const statusBar = document.getElementById('current-show');

        if (CURRENT_MODE === "фильмы") {
            // 🎬 РЕЖИМ: ДЕНЬ ФИЛЬМОВ
            scheduleTitle.innerHTML = "Расписание RNDM TV (День Фильмов) 🍿";
            scheduleList.innerHTML = `
                <div class="schedule-item"><span class="time">09:00 - 10:30</span><span class="title">«Просыпайся-ка» (Утренний бодряк)</span></div>
                <div class="schedule-item"><span class="time">10:30 - 12:30</span><span class="title">«Мульт-тайм» (Топовые мультики)</span></div>
                <div class="schedule-item"><span class="time">12:30 - 00:00</span><span class="title">Большой Киномарафон (Фильмы и Сериалы нон-стоп)</span></div>
            `;

            if (timeInMinutes >= 540 && timeInMinutes < 630) {
                statusBar.innerHTML = "«Просыпайся-ка» ☀️";
            } else if (timeInMinutes >= 630 && timeInMinutes < 750) {
                statusBar.innerHTML = "«Мульт-тайм» ⚡";
            } else {
                statusBar.innerHTML = "Большой Киномарафон (Фильмы и Сериалы) 🎬🔥";
            }

        } else if (CURRENT_MODE === "шоу") {
            // 🌟 РЕЖИМ: ВАШИ ТЕЛЕПЕРЕДАЧИ (Спец-эфир)
            scheduleTitle.innerHTML = "Расписание RNDM TV (СПЕЦ-ВЫПУСК) 🚀";
            scheduleList.innerHTML = `
                <div class="schedule-item"><span class="time">09:00 - 10:30</span><span class="title">«Просыпайся-ка» (Утренний бодряк)</span></div>
                <div class="schedule-item"><span class="time">12:00 - 15:00</span><span class="title">«Мульт-тайм» (Дневной блок)</span></div>
                <div class="schedule-item"><span class="time">17:00 - 20:00</span><span class="title">🔥 НАШИ ПЕРЕДАЧИ (Эксклюзивные шоу от админов!)</span></div>
                <div class="schedule-item"><span class="time">20:00 - 23:00</span><span class="title">Вечернее кино кино кино</span></div>
            `;

            if (timeInMinutes >= 540 && timeInMinutes < 630) {
                statusBar.innerHTML = "«Просыпайся-ка» ☀️";
            } else if (timeInMinutes >= 720 && timeInMinutes < 900) {
                statusBar.innerHTML = "«Мульт-тайм» 🧸";
            } else if (timeInMinutes >= 1020 && timeInMinutes < 1200) {
                statusBar.innerHTML = "🔥 ЭФИР АДМИНОВ: Наши Спец-Передачи! 🔥";
            } else {
                statusBar.innerHTML = "Вечерний чилл 🌙";
            }

        } else {
            // 🧸 РЕЖИМ ПО УМОЛЧАНИЮ: ОБЫЧНЫЙ ДЕНЬ
            scheduleTitle.innerHTML = "Расписание RNDM TV (Обычный день) 📺";
            scheduleList.innerHTML = `
                <div class="schedule-item"><span class="time">09:00 - 10:30</span><span class="title">«Просыпайся-ка» (Утренний бодряк)</span></div>
                <div class="schedule-item"><span class="time">10:30 - 18:00</span><span class="title">«Мульт-тайм» (Целый день любимых мультиков)</span></div>
                <div class="schedule-item"><span class="time">18:00 - 22:00</span><span class="title">«Музыкальная вечеринка» (Анимации и треки)</span></div>
                <div class="schedule-item"><span class="time">22:00 - 09:00</span><span class="title">Ночной эфир (Повторы лучших шоу)</span></div>
            `;

            if (timeInMinutes >= 540 && timeInMinutes < 630) {
                statusBar.innerHTML = "«Просыпайся-ка» ☀️";
            } else if (timeInMinutes >= 630 && timeInMinutes < 1080) {
                statusBar.innerHTML = "«Мульт-тайм» (Марафон мультсериалов) 🧸";
            } else if (timeInMinutes >= 1080 && timeInMinutes < 1320) {
                statusBar.innerHTML = "«Музыкальная вечеринка» 🎵🕺";
            } else {
                statusBar.innerHTML = "Ночной эфир (Повторы) 🌙";
            }
        }
    }

    updateTV();
    setInterval(updateTV, 60000);
</script>

</body>
</html>
