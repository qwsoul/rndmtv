<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNDM TV — Главный плеер</title>
    
    <!-- Подключаем стильный плеер Video.js -->
    <link href="https://zencdn.net" rel="stylesheet" />
    
    <style>
        /* Общие стили для вайба RNDM TV */
        body {
            background-color: #0b0b0b !important; /* Глубокий черный цвет */
            color: #ffffff;
            font-family: 'Futura', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            margin-top: 20px;
        }

        /* Стиль плеера */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Идеальные пропорции экрана 16:9 */
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.35); /* Фирменное оранжевое свечение */
            margin-bottom: 20px;
            background-color: #000000;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Информационная плашка "Сейчас в эфире" */
        .status-bar {
            background-color: #141414;
            border: 2px solid #ff6600; /* Твой сочный оранжевый цвет */
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .status-online {
            color: #ff6600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 5px;
        }

        /* Блок расписания передач */
        .schedule {
            background-color: #111111;
            border-radius: 12px;
            padding: 25px;
            text-align: left;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            border: 1px solid #1f1f1f;
        }

        .schedule h2 {
            margin-top: 0;
            color: #ff6600;
            font-size: 1.5em;
            border-bottom: 2px solid #ff6600;
            padding-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .schedule-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #1c1c1c;
            font-size: 1.05em;
        }

        .schedule-item:last-child {
            border-bottom: none;
        }

        .time {
            color: #ff6600;
            font-weight: bold;
            min-width: 120px;
        }

        .title {
            color: #ffffff;
            flex-grow: 1;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Главный экран трансляции -->
    <div class="video-wrapper">
        <video 
            id="rndm-player" 
            class="video-js vjs-default-skin vjs-big-play-centered" 
            controls 
            preload="auto" 
            data-setup='{}'>
            <!-- В src ниже вставляется ссылка на поток (пока стоит стандартное видео океана для теста) -->
            <source src="https://zencdn.net" type="video/mp4" />
            <p class="vjs-no-js">
                Бро, обнови браузер, иначе RNDM TV не запустить!
            </p>
        </video>
    </div>

    <!-- Инфо-бар -->
    <div class="status-bar">
        <span class="status-online">● СЕЙЧАС В ЭФИРЕ:</span> <span id="current-show">Мульт-тайм 🔥</span>
    </div>

    <!-- Обновленная сетка вещания -->
    <div class="schedule">
        <h2>Расписание RNDM TV (День Фильмов)</h2>
        <div class="schedule-item">
            <span class="time">09:00 - 10:30</span>
            <span class="title">«Просыпайся-ка» (Утренний бодряк)</span>
        </div>
        <div class="schedule-item">
            <span class="time">10:30 - 12:30</span>
            <span class="title">«Мульт-тайм» (2 часа топовых хайповых мультиков)</span>
        </div>
        <div class="schedule-item">
            <span class="time">12:30 - 00:00</span>
            <span class="title">Большой Киномарафон (Фильмы и Сериалы нон-стоп до полуночи)</span>
        </div>
    </div>

</div>

<!-- Скрипты для работы плеера на мобилках -->
<script src="https://zencdn.net"></script>

</body>
</html>
