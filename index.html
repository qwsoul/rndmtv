<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNDM TV — Главный плеер</title>
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        body {
            background-color: #0b0b0b !important;
            color: #ffffff;
            font-family: 'Futura', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 800px; width: 100%; text-align: center; margin-top: 20px; }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.35);
            margin-bottom: 20px;
            background-color: #000000;
        }
        .video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .status-bar {
            background-color: #141414;
            border: 2px solid #ff6600;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .status-online { color: #ff6600; text-transform: uppercase; letter-spacing: 1px; margin-right: 5px; }
        .schedule {
            background-color: #111111;
            border-radius: 12px;
            padding: 25px;
            text-align: left;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            border: 1px solid #1f1f1f;
        }
        .schedule h2 {
            margin-top: 0; color: #ff6600; font-size: 1.5em;
            border-bottom: 2px solid #ff6600; padding-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .schedule-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1c1c1c; font-size: 1.05em; }
        .schedule-item:last-child { border-bottom: none; }
        .time { color: #ff6600; font-weight: bold; min-width: 120px; }
        .title { color: #ffffff; flex-grow: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="video-wrapper">
        <!-- Добавилиplaysinline атрибуты для нормального фуллскрина на планшетах -->
        <video id="rndm-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" playsinline webkit-playsinline data-setup='{"userActions":{"doubleClick":true}}'>
            <source id="video-source" src="https://zencdn.net" type="video/mp4" />
        </video>
    </div>

    <div class="status-bar">
        <span class="status-online">● СЕЙЧАС В ЭФИРЕ:</span> <span id="current-show">Загрузка...</span>
    </div>

    <div class="schedule">
        <h2 id="schedule-title">Расписание RNDM TV</h2>
        <div id="schedule-list"></div>
    </div>
</div>

<script src="https://zencdn.net"></script>

<script>
    // =================================================================
    // 🎛️ ХАКЕРСКИЙ ПУЛЬТ УПРАВЛЕНИЯ ВИДЕОПОТОКАМИ (СИНХРОННО ПО МСК)
    // Вставляй сюда свои ссылки .mp4 между кавычками для каждого блока!
    // =================================================================
    const VIDEO_ZARYADKA = "https://zencdn.net"; // Видео для "Просыпайся-ка"
    const VIDEO_MULT_TIME = "https://zencdn.net"; // Видео для "Мульт-тайм"
    const VIDEO_VECHER     = "https://zencdn.net"; // Видео для Вечернего эфира (Кино или Музыка)
    
    // Режим канала: "мультики", "фильмы" или "шоу"
    const CURRENT_MODE = "мультики"; 

    function updateTV() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const adminTime = new Date(utc + (3600000 * 3)); // Время строго по МСК
        
        const hours = adminTime.getHours();
        const minutes = adminTime.getMinutes();
        const timeInMinutes = hours * 60 + minutes;

        const scheduleTitle = document.getElementById('schedule-title');
        const scheduleList = document.getElementById('schedule-list');
        const statusBar = document.getElementById('current-show');
        const player = videojs('rndm-player');

        let nextVideo = "";
        let currentShowTitle = "";

        if (CURRENT_MODE === "фильмы") {
            scheduleTitle.innerHTML = "Расписание RNDM TV (День Фильмов) 🍿";
            scheduleList.innerHTML = `
                <div class="schedule-item"><span class="time">09:00 - 10:30</span><span class="title">«Просыпайся-ка» (Утренний бодряк)</span></div>
                <div class="schedule-item"><span class="time">10:30 - 12:30</span><span class="title">«Мульт-тайм» (Топовые мультики)</span></div>
                <div class="schedule-item"><span class="time">12:30 - 00:00</span><span class="title">Большой Киномарафон (Фильмы и Сериалы нон-стоп)</span></div>
            `;

            if (timeInMinutes >= 540 && timeInMinutes < 630) {
                currentShowTitle = "«Просыпайся-ка» ☀️";
                nextVideo = VIDEO_ZARYADKA;
            } else if (timeInMinutes >= 630 && timeInMinutes < 750) {
                currentShowTitle = "«Мульт-тайм» ⚡";
                nextVideo = VIDEO_MULT_TIME;
            } else {
                currentShowTitle = "Большой Киномарафон (Фильмы и Сериалы) 🎬🔥";
                nextVideo = VIDEO_VECHER;
            }

        } else {
            // ОБЫЧНЫЙ ДЕНЬ
            scheduleTitle.innerHTML = "Расписание RNDM TV (Обычный день) 📺";
            scheduleList.innerHTML = `
                <div class="schedule-item"><span class="time">09:00 - 10:30</span><span class="title">«Просыпайся-ка» (Утренний бодряк)</span></div>
                <div class="schedule-item"><span class="time">10:30 - 18:00</span><span class="title">«Мульт-тайм» (Целый день любимых мультиков)</span></div>
                <div class="schedule-item"><span class="time">18:00 - 20:00</span><span class="title">«Музыкальная вечеринка» (Анимации и треки)</span></div>
                <div class="schedule-item"><span class="time">20:00 - 09:00</span><span class="title">Ночной эфир (Уютные мультики перед сном)</span></div>
            `;

            if (timeInMinutes >= 540 && timeInMinutes < 630) {
                currentShowTitle = "«Просыпайся-ка» ☀️";
                nextVideo = VIDEO_ZARYADKA;
            } else if (timeInMinutes >= 630 && timeInMinutes < 1080) {
                currentShowTitle = "«Мульт-тайм» 🧸";
                nextVideo = VIDEO_MULT_TIME;
            } else if (timeInMinutes >= 1080 && timeInMinutes < 1200) {
                currentShowTitle = "«Музыкальная вечеринка» 🎵🕺";
                nextVideo = VIDEO_VECHER;
            } else {
                currentShowTitle = "Ночной эфир (Уютные мультики) 🌙💤";
                nextVideo = VIDEO_MULT_TIME; // Ночью крутим повтор мультиков
            }
        }

        // Если видео изменилось по времени — переключаем его в плеере автоматически!
        if (statusBar.innerHTML !== currentShowTitle) {
            statusBar.innerHTML = currentShowTitle;
            const currentPosition = player.currentTime(); // Запоминаем место, если это просто рефреш
            
            player.src({ type: 'video/mp4', src: nextVideo });
            
            // Если видео то же самое, не сбрасываем просмотр на начало
            if(currentPosition > 0) {
               player.currentTime(currentPosition);
            }
        }
    }

    // Запускаем робота
    videojs('rndm-player').ready(function() {
        updateTV();
        setInterval(updateTV, 30000); // Проверяем время каждые 30 секунд
    });
</script>

</body>
</html>
